# jaws project file: Pi's own cloud resources. Fields and behaviour:
# https://github.com/Jaws-Platform/jaws/blob/main/docs/research-projects.md
#
# The project is named pi-prover, not pi: jaws matches a project's roles as
# <org>-<project>-*, so a project named pi would also match pi-benchmarks'.
#
# Today it is one dataset and no task runner, so jaws creates the bucket and
# nothing else: no network, no instances. Nothing automated writes it. The
# owner publishes each finished, audited run with admin credentials
# (`pi publish`). Training adds a task runner here later.
version: 1
project: pi-prover
repository: Pi-Mathematical-Reasoning/pi

# The tags every resource carries (through the provider's default_tags).
# Project, Repository and Environment=prod are cross-checked; jaws adds
# Organization (this repository's GitHub owner) and ManagedBy itself.
tags:
  Project: pi-prover
  Environment: prod
  Repository: Pi-Mathematical-Reasoning/pi
  Owner: jwallace145

components:
  - kind: dataset
    name: artifacts
    bucket: jaws-pi-prover-artifacts  # <name_root>-<project>-<name>
    prefix: data/
    # Run records are kept forever, and an overwritten or deleted object stays
    # recoverable. Each run lives under data/runs/<run>/, and its
    # _manifest.json is written last: its presence means the run is complete.
    versioning: true
