[project]
name = "pi"
# Never published: Pi runs from a checkout, and an experiment cites the git
# revision it ran at. This number is not the release version, which Release
# Please keeps in version.txt.
version = "0.0.0"
description = "Local-first mathematical reasoning: proofs from an open-weight model, checked by Lean 4."
readme = "README.md"
license = "MIT"
# Capped below 3.14 because MLX, the candidate inference backend, publishes no
# wheels for it yet. .python-version pins the interpreter uv uses.
requires-python = ">=3.12,<3.14"
dependencies = [
    "math-verify==0.9.0",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
]

[project.scripts]
pi = "pi.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Holds a whole report verbatim, and a report's table rows are long.
"tests/test_report.py" = ["E501"]
